<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Odoo 19 installer flow</title>
  <desc id="desc">The flow from running the platform installer, through validation and questions, to Odoo, PostgreSQL, optional Enterprise, optional pgAdmin, health checks, and the installation summary.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; font-style: normal; }
      .title { font-size: 40px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 19px; font-weight: 400; fill: #526076; }
      .step { font-size: 14px; font-weight: 700; letter-spacing: 1.6px; fill: #714b67; }
      .heading { font-size: 24px; font-weight: 700; fill: #172033; }
      .body { font-size: 17px; font-weight: 400; fill: #475569; }
      .small { font-size: 15px; font-weight: 500; fill: #64748b; }
      .white-heading { font-size: 24px; font-weight: 700; fill: white; }
      .white-body { font-size: 16px; font-weight: 400; fill: #f8fafc; }
      .badge { font-size: 13px; font-weight: 700; fill: white; letter-spacing: 0.7px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1120" rx="28" fill="#f4f7fb"/>
  <text class="title" x="80" y="70">Odoo 19 one-command installer — complete flow</text>
  <text class="subtitle" x="80" y="104">Guided choices, automatic Enterprise detection, plan review, and clear next steps.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="145" width="320" height="160" rx="20" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
    <text class="step" x="110" y="180">STEP 1</text>
    <text class="heading" x="110" y="217">Run the installer</text>
    <text class="body" x="110" y="252">Ubuntu: ./install-ubuntu.sh</text>
    <text class="body" x="110" y="280">Windows: .\install-windows.ps1</text>

    <rect x="480" y="145" width="320" height="160" rx="20" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
    <text class="step" x="510" y="180">STEP 2</text>
    <text class="heading" x="510" y="217">Validate platform</text>
    <text class="body" x="510" y="252">Ubuntu version and user, or</text>
    <text class="body" x="510" y="280">Windows PowerShell entry</text>

    <rect x="880" y="145" width="640" height="160" rx="20" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
    <text class="step" x="910" y="180">STEP 3</text>
    <text class="heading" x="910" y="217">Choose an action</text>
    <text class="body" x="910" y="252">Ubuntu: Community • Enterprise • Both • dependencies • uninstall</text>
    <text class="body" x="910" y="280">Windows: guided editions • both platforms check Docker</text>
  </g>

  <path class="arrow" d="M 400 225 L 466 225"/>
  <path class="arrow" d="M 800 225 L 866 225"/>

  <path class="arrow" d="M 1200 305 L 1200 348 L 800 348 L 800 385"/>
  <g filter="url(#shadow)">
    <rect x="250" y="390" width="1100" height="120" rx="20" fill="#714b67"/>
    <text class="step" x="290" y="425" fill="#f4dff0">STEP 4</text>
    <text class="white-heading" x="290" y="462">Configure selected services, review the plan, and confirm</text>
    <text class="white-body" x="290" y="490">Detected Enterprise addons • relevant ports • pgAdmin • final approval</text>
  </g>

  <path class="arrow" d="M 800 510 L 800 555 L 260 555 L 260 595"/>
  <path class="arrow" d="M 800 510 L 800 595"/>
  <path class="arrow" d="M 800 555 L 1340 555 L 1340 595"/>

  <g filter="url(#shadow)">
    <rect x="80" y="600" width="360" height="155" rx="20" fill="#ffffff" stroke="#714b67" stroke-width="3"/>
    <rect x="105" y="620" width="118" height="27" rx="14" fill="#16a34a"/>
    <text class="badge" x="121" y="639">SELECTABLE</text>
    <text class="heading" x="110" y="686">Community stack</text>
    <text class="body" x="110" y="720">Odoo Community + PostgreSQL</text>
    <text class="small" x="110" y="744">Default web port: 8069</text>

    <rect x="620" y="600" width="360" height="155" rx="20" fill="#ffffff" stroke="#714b67" stroke-width="3"/>
    <rect x="645" y="620" width="150" height="27" rx="14" fill="#d97706"/>
    <text class="badge" x="661" y="639">CONDITIONAL</text>
    <text class="heading" x="650" y="686">Enterprise stack</text>
    <text class="body" x="650" y="720">Odoo + licensed Enterprise addons</text>
    <text class="small" x="650" y="744">Starts when addons are supplied</text>

    <rect x="1160" y="600" width="360" height="155" rx="20" fill="#ffffff" stroke="#336791" stroke-width="3"/>
    <rect x="1185" y="620" width="150" height="27" rx="14" fill="#d97706"/>
    <text class="badge" x="1201" y="639">CONDITIONAL</text>
    <text class="heading" x="1190" y="686">pgAdmin stack</text>
    <text class="body" x="1190" y="720">Web UI + registered DB servers</text>
    <text class="small" x="1190" y="744">Default web port: 5050</text>
  </g>

  <path class="arrow" d="M 260 755 L 260 800 L 800 800 L 800 835"/>
  <path class="arrow" d="M 800 755 L 800 835"/>
  <path class="arrow" d="M 1340 755 L 1340 800 L 800 800"/>

  <g filter="url(#shadow)">
    <rect x="250" y="840" width="1100" height="105" rx="20" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <text class="step" x="290" y="875" fill="#15803d">STEP 5</text>
    <text class="heading" x="290" y="912">Generate config, pull images, start services, and wait for health</text>
  </g>

  <path class="arrow" d="M 800 945 L 800 985"/>
  <g filter="url(#shadow)">
    <rect x="400" y="990" width="800" height="85" rx="20" fill="#172033"/>
    <text class="white-heading" x="445" y="1028">Ready</text>
    <text class="white-body" x="555" y="1028">URLs and credentials saved to installation-info.txt</text>
    <text class="white-body" x="555" y="1055">Persistent Docker volumes keep databases and filestores</text>
  </g>
</svg>
